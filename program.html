<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4ヶ月プログラム｜挑戦できる自分をつくる16週間</title>
<meta name="description" content="理学療法士がつくった、週6日・8種目の16週間プログラム。MAXを入れると、毎日の重さが自動で出ます。記録もスマホで。">
<meta name="theme-color" content="#1F2A44">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --wash: #F3F6FA;
    --grid: #E9EFF6;
    --rule: #CDD6E1;
    --ink: #1F2A44;
    --ink-2: #56607A;
    --redpen: #D62F3C;
    --redpen-tint: #FFF4F4;
    --line: #00873C;
    --line-hover: #006F31;
    --focus: #2B6CB0;
    --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif;
    --pen: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --tabs-h: 60px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: 0.02em;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-attachment: fixed;
    padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 24px);
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  a { color: inherit; }
  h1, h2, h3 { margin: 0; line-height: 1.4; }
  .num { font-variant-numeric: tabular-nums; }
  .pen { font-family: var(--pen); font-weight: 600; color: var(--redpen); }

  /* 上の帯 */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink); color: #fff;
    padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
  }
  .top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .top .title { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .top .title small { display: block; font-size: 11.5px; font-weight: 400; opacity: .8; }
  .top .today-btn {
    border: 1px solid rgba(255,255,255,.55); background: transparent; color: #fff;
    border-radius: 999px; padding: 6px 14px; font-size: 13px; min-height: 36px;
  }
  .top .today-btn[hidden] { display: none; }

  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .page { background: var(--paper); border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); margin: 0 -16px; padding: 20px 16px 28px; min-height: 60vh; }

  /* 日の見出し */
  .phase { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .phase .light { color: var(--redpen); border: 1px solid var(--redpen); border-radius: 4px; padding: 0 6px; font-size: 12px; }
  .dayline { display: flex; align-items: center; gap: 8px; }
  .dayline h1 { flex: 1; font-size: 24px; }
  .dayline h1 .wk { font-size: 15px; color: var(--ink-2); font-weight: 400; margin-right: 8px; }
  .arrow { width: 44px; height: 44px; border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); font-size: 18px; line-height: 1; }
  .arrow:disabled { opacity: .3; cursor: default; }
  .date { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
  .strip { list-style: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0 0; padding: 0; }
  .strip button {
    width: 100%; min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper);
    font-size: 14px; position: relative; padding: 4px 0;
  }
  .strip .is-cur button { border: 2px solid var(--ink); font-weight: 700; }
  .strip .is-done button { background: var(--wash); }
  .strip .is-done button::after { content: "済"; position: absolute; right: 3px; top: 1px; font-size: 10px; color: var(--redpen); font-family: var(--pen); }
  .strip .is-today button { box-shadow: inset 0 -3px 0 var(--redpen); }

  /* はじめに */
  .start { border: 2px solid var(--ink); border-radius: 12px; padding: 16px; margin: 0 0 20px; background: var(--paper); }
  .start h2 { font-size: 18px; margin-bottom: 6px; }
  .start p { margin: 0 0 10px; font-size: 14.5px; }
  .start .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .start input[type=date] { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; min-height: 44px; background: var(--paper); }

  /* 体調 */
  .check { margin: 20px 0 0; padding: 14px 0 4px; border-top: 2px solid var(--ink); }
  .check h2, .ex h2, .memo h2, .sec h2 { font-size: 18px; }
  .check .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .check .lab { width: 5.5em; font-size: 14px; color: var(--ink-2); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-left: 1px solid var(--rule); background: var(--paper); min-width: 44px; min-height: 40px; font-size: 15px; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .field { display: inline-flex; align-items: baseline; gap: 4px; }
  .field input { width: 4em; border: 0; border-bottom: 1.5px solid var(--ink-2); background: transparent; text-align: right; padding: 4px 2px; font-size: 17px; }
  .advice { margin: 12px 0 0; padding: 10px 12px; background: var(--redpen-tint); border-left: 3px solid var(--redpen); font-size: 15px; line-height: 1.6; }
  .advice small { display: block; font-family: var(--font); font-weight: 400; color: var(--ink-2); font-size: 12px; margin-bottom: 2px; }

  /* 種目 */
  .ex { margin: 22px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); }
  .ex h2 small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  .presc { margin: 2px 0 0; font-size: 14.5px; }
  .hint { margin: 4px 0 0; font-size: 16px; line-height: 1.5; }
  .hint.first { font-size: 14.5px; }
  .hint .nw { white-space: nowrap; }
  .prev { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
  .sets { margin-top: 8px; }
  .set { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--rule); flex-wrap: wrap; }
  @media (max-width: 359px) { .set { gap: 5px; } .f.kg input { width: 3.1em; } .f input { font-size: 17px; } }
  .mark {
    position: relative; flex: 0 0 44px; width: 44px; height: 44px; border: 0; background: transparent; padding: 0;
    font-size: 15px; font-weight: 700; color: var(--ink);
  }
  .mark svg { position: absolute; inset: 0; width: 44px; height: 44px; overflow: visible; }
  .mark .ring { fill: none; stroke: var(--rule); stroke-width: 1.5; }
  .mark .pencircle { fill: none; stroke: var(--redpen); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 140; stroke-dashoffset: 140; }
  .mark[aria-pressed="true"] .pencircle { stroke-dashoffset: 0; }
  .mark[aria-pressed="true"] .ring { stroke: transparent; }
  .mark[aria-pressed="true"] { color: var(--redpen); }
  .mark.just .pencircle { transition: stroke-dashoffset .45s ease-out; }
  .f { display: inline-flex; align-items: baseline; gap: 3px; font-size: 13px; color: var(--ink-2); }
  .f input { border: 0; border-bottom: 1.5px solid var(--ink-2); background: transparent; text-align: right; padding: 4px 2px; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .f.kg input { width: 3.6em; }
  .f.reps input { width: 1.9em; }
  .f input.sug { color: var(--redpen); font-family: var(--pen); font-weight: 600; }
  .f select { border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); padding: 4px 2px; font-size: 15px; color: var(--ink); min-height: 36px; }
  .x { color: var(--ink-2); font-size: 14px; }
  .tag { font-size: 11.5px; color: var(--redpen); border: 1px solid var(--redpen); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  .grad { margin: 10px 0 4px; padding: 10px 12px; background: var(--redpen-tint); border-left: 3px solid var(--redpen); }
  .grad p { margin: 0 0 4px; font-size: 14.5px; line-height: 1.6; }
  .grad .pen { font-size: 15.5px; }
  .gl-h { font-weight: 700; font-size: 13.5px !important; margin-top: 8px !important; }
  .gl { margin: 2px 0 8px; padding-left: 0; list-style: none; font-size: 14.5px; }
  .gl li { position: relative; padding-left: 1.5em; margin: 3px 0; }
  .gl li::before { content: ""; position: absolute; left: .35em; top: .62em; width: .42em; height: .42em; border-radius: 50%; background: var(--redpen); }
  .grad details { margin: 6px 0 8px; }
  .grad summary { cursor: pointer; font-weight: 700; font-size: 14px; min-height: 36px; display: flex; align-items: center; }
  .gbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.small, .btn-line.small { min-height: 44px; padding: 0 14px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .btn-line.small { border-radius: 999px; }
  .gradcard { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .gradcard h3 { font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .gradcard .st { font-size: 12.5px; font-weight: 400; border: 1px solid var(--ink-2); color: var(--ink-2); border-radius: 4px; padding: 0 6px; }
  .gradcard .st.ok { border-color: var(--redpen); color: var(--redpen); font-family: var(--pen); font-weight: 600; }
  .gradcard .film { font-size: 13.5px; margin: 0 0 8px; }
  .gl-line { margin-top: 14px; }
  .basebox { margin: 10px 0 4px; padding: 10px 12px; border: 1.5px dashed var(--ink-2); border-radius: 8px; }
  .basebox p { margin: 0 0 6px; font-size: 14px; line-height: 1.6; }
  .basebox .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  table.wk td { font-size: 14.5px; }
  table.wk td:first-child { white-space: nowrap; }
  .tips { margin-top: 8px; font-size: 14px; }
  .tips summary, .grad summary { list-style: none; }
  .tips summary::-webkit-details-marker, .grad summary::-webkit-details-marker { display: none; }
  .tips summary::before, .grad summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--ink-2); transition: transform .15s; }
  .tips details[open] > summary::before, details.tips[open] > summary::before, .grad details[open] > summary::before { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .tips summary::before, .grad summary::before { transition: none; } }
  .tips summary { cursor: pointer; color: var(--ink-2); min-height: 36px; display: flex; align-items: center; }
  .tips ul { margin: 4px 0 6px; padding-left: 1.2em; }
  .tips a, .formlist a { color: var(--focus); }
  .muted { color: var(--ink-2); }

  /* MAX */
  .ml { min-width: 6.4em; font-size: 14px; color: var(--ink-2); }
  .start .mh { font-weight: 700; font-size: 15px; margin: 16px 0 0; }
  .start .note, .note { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin: 8px 0 4px; }
  .start .row .ml { min-width: 0; }
  .maxgrid { margin: 2px 0 8px; }
  .mrow { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--rule); flex-wrap: wrap; }
  .mnote { font-size: 12.5px; }
  .f.kg.mx input { width: 4.4em; }
  .status[data-mmsg] { color: var(--ink); }
  .total { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
  .total b { font-size: 21px; color: var(--ink); margin: 0 2px 0 8px; }
  .linkbtn { border: 0; background: none; padding: 0 0 0 6px; color: var(--focus); text-decoration: underline; font-size: inherit; min-height: 32px; }
  table.wk .wkg { margin-left: 8px; font-family: var(--pen); color: var(--redpen); font-weight: 600; }
  .calc { margin-top: 10px; }
  .calc .cl { margin: 2px 0 6px; font-size: 13.5px; }
  .calc .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .basebox .row .ml { min-width: 0; }

  /* 休み */
  .rest { margin-top: 20px; padding-top: 14px; border-top: 2px solid var(--ink); }
  .rest p { margin: 8px 0 0; }

  /* メモと日報 */
  .memo { margin: 26px 0 0; padding-top: 14px; border-top: 2px solid var(--ink); }
  .memo label { display: block; font-size: 14px; color: var(--ink-2); margin: 8px 0 4px; }
  .memo textarea { width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 10px; font-size: 16px; background: var(--paper); resize: vertical; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 15px; text-decoration: none; }
  .btn.wide { width: 100%; margin-top: 12px; }
  .status { min-height: 1.5em; margin: 6px 0 0; font-size: 13.5px; color: var(--line); }

  /* 有料の案内 */
  .cta { margin: 30px 0 0; padding: 18px 16px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); }
  .cta .pen { font-size: 19px; margin: 0 0 6px; line-height: 1.5; }
  .cta p { margin: 0 0 12px; font-size: 14.5px; }
  .btn-line { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: var(--line); color: #fff; font-weight: 700; text-decoration: none; font-size: 16px; }
  .btn-line:hover { background: var(--line-hover); }

  /* 一覧・ルール・フォーム・記録 */
  .sec { margin: 22px 0 0; padding-top: 14px; border-top: 2px solid var(--ink); }
  .sec:first-of-type { margin-top: 4px; }
  .sec p, .sec li { font-size: 15px; }
  .page > h1 { font-size: 24px; margin-bottom: 4px; }
  .lead { margin: 0 0 6px; color: var(--ink-2); font-size: 14.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 700; color: var(--ink-2); font-size: 13px; }
  .weeks { list-style: none; margin: 8px 0 0; padding: 0; }
  .weeks button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 10px 2px; display: grid; grid-template-columns: 3.4em 1fr auto; gap: 4px 10px; align-items: baseline; }
  .weeks .n { font-weight: 700; font-size: 16px; }
  .weeks .m { font-size: 13.5px; color: var(--ink-2); }
  .weeks .p { font-size: 13px; color: var(--ink-2); }
  .weeks .is-cur button { background: var(--redpen-tint); }
  .weeks .is-cur .n { color: var(--redpen); }
  .phase-h { margin: 20px 0 0; font-size: 16px; }
  .phase-h small { font-weight: 400; color: var(--ink-2); font-size: 13px; margin-left: 6px; }
  .rules { padding-left: 1.2em; margin: 8px 0 0; }
  .rules li { margin: 6px 0; }
  .rules b { display: block; }
  .formlist { list-style: none; margin: 0; padding: 0; }
  .formlist > li { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .formlist h3 { font-size: 17px; }
  .formlist ul { margin: 6px 0; padding-left: 1.2em; font-size: 15px; }
  .links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
  .best { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .best > div { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 8px; background: var(--paper); }
  .best .l { font-size: 12.5px; color: var(--ink-2); }
  .best .v { font-size: 18px; font-weight: 700; }
  .best .d { font-size: 12.5px; }
  .danger { border-color: var(--redpen); color: var(--redpen); }
  .fine { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; margin-top: 28px; }
  .fine p { margin: 0 0 6px; }
  .fine .legal { display: flex; flex-wrap: wrap; gap: 0 18px; }
  .fine .legal a { color: var(--ink-2); display: inline-block; padding: 6px 0; }

  /* 下のタブ */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--paper); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs ul { list-style: none; margin: 0 auto; padding: 0; max-width: 560px; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tabs button { width: 100%; height: var(--tabs-h); border: 0; background: transparent; font-size: 13.5px; color: var(--ink-2); position: relative; }
  .tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 12px; height: 3px; border-radius: 2px; background: var(--redpen); }
  .savewarn { background: var(--redpen-tint); color: var(--redpen); font-size: 13px; padding: 8px 12px; margin: 0 0 12px; border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .mark.just .pencircle { transition: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <p class="title" id="topTitle">4ヶ月プログラム<small>挑戦できる自分をつくる16週間</small></p>
    <button class="today-btn" id="todayBtn" type="button" hidden>今日へ</button>
  </div>
</header>
<main>
  <div class="page" id="app" aria-live="off"></div>
</main>
<nav class="tabs" aria-label="ページの切り替え">
  <ul>
    <li><button type="button" data-tab="today">今日</button></li>
    <li><button type="button" data-tab="weeks">16週</button></li>
    <li><button type="button" data-tab="rules">ルール</button></li>
    <li><button type="button" data-tab="form">フォーム</button></li>
    <li><button type="button" data-tab="log">記録</button></li>
  </ul>
</nav>
<script>
/* ===== ここだけ書き換えてください ===== */
const CONFIG = {
  coachName: "〔お名前〕",                 // 表示する名前
  lineUrl: "https://lin.ee/XXXXXXX",      // 公式LINEの友だち追加URL
  pdfUrl: "program.pdf",                  // PDF版（同じフォルダに置く）
  termsUrl: "terms.html",                 // 利用規約（同じフォルダに置く）
  privacyUrl: "privacy.html",             // プライバシーポリシー（同じフォルダに置く）
  form3dUrl: "",                          // 3Dのフォーム見本を公開したらURLを入れる
  videos: {                               // 教材動画のURL（空欄なら「準備中」と表示）
    squat: "", bench: "", deadlift: "",
    pullup: "", lateral: "", curl: "", calf: "", abs: ""
  }

  h += '<section class="sec"><h2>RPEのめやす</h2><p class="lead">5回やり終えたとき、あと何回できそうだったか。</p><table><thead><tr><th>RPE</th><th>感覚</th></tr></thead><tbody>' +
    P.rpe.map(([r, t]) => '<tr><td class="num">' + r2(r) + "</td><td>" + esc(t) + "</td></tr>").join("") +
    '<tr><td class="num">9以上</td><td>このプログラムでは使いません</td></tr></tbody></table></section>';
  h += '<section class="sec"><h2>体調チェックのルール</h2><p class="lead">トレーニング前に、睡眠・疲れ・痛みをチェックします。</p><ul class="rules">' +
    P.checkRules.map(x => "<li><b>" + esc(x.when) + "</b>" + esc(x.do) + "</li>").join("") + "</ul></section>";
  h += '<section class="sec"><h2>ウォームアップと休憩</h2><ul class="rules">' +
    "<li>BIG3は、その日の重さの前に「バーだけ10回 → 半分の重さで5回 → 7割で3回 → 9割で1回」。</li>" +
    "<li>セットの間の休憩は、BIG3が2〜3分、補助種目が1〜1分半。</li>" +
    "<li>休んだ日は、翌日に詰め込まずに飛ばして次へ進みます。</li></ul></section>";
  app.innerHTML = h + fine();
}

/* ---- フォーム ---- */
function renderForm() {
  let h = "<h1>フォームのポイント</h1><p class=\"lead\">BIG3は教材動画でポイントを覚えてから始めましょう。</p>";
  h += '<section class="sec"><h2>BIG3 初心者卒業ライン</h2><p class="lead">できているかどうかは、初日から送ってもらう動画で、理学療法士が確かめます。</p><ol class="rules">' +
    P.gradRules.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol>";
  BIG3.forEach(l => {
    const g = P.grad[l], d = S.grad[l];
    h += '<div class="gradcard"><h3>' + esc(P.lifts[l].name) + '<span class="st' + (d ? " ok" : "") + '">' + (d ? "卒業 " + esc(jpDate(parseYmd(d))) : "卒業前") + "</span></h3>" +
      '<ul class="gl">' + g.lines.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
      '<p class="muted film">撮り方：' + esc(g.film) + "</p>" +
      (d ? '<button class="btn small" type="button" data-ungrad="' + l + '">卒業を取り消す</button>'
         : '<button class="btn small" type="button" data-grad="' + l + '">卒業の返信が来たら押す</button>') + "</div>";
  });
  h += '<p class="gl-line"><a class="btn-line" href="' + esc(CONFIG.lineUrl) + '" target="_blank" rel="noopener">LINEで動画を送る</a></p></section>';
  h += '<section class="sec"><h2>8種目のポイント</h2><ul class="formlist">';
  Object.keys(P.lifts).forEach(l => {
    h += "<li><h3>" + esc(P.lifts[l].name) + "</h3><ul>" + (P.form[l] || []).map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>" +
      '<div class="links">' + videoLinks(l) + "</div></li>";
  });
  app.innerHTML = h + "</ul></section>" + fine();
}

/* ---- 記録 ---- */
function renderLog() {
  const cw = S.start ? posOf(todayIndex()).w : V.w;
  let h = "<h1>記録</h1><p class=\"lead\">MAXは、85%の日に3セットとも5回・RPE8.5以内でできた週の次の週に上がります。</p>";
  h += '<div class="best">' + BIG3.map(l => {
    const name = esc(SHORT[l]);
    if (isPre(l)) return '<div><div class="l">' + name + '</div><div class="d muted">卒業前' + (S.maxIn[l] ? '<br>MAX <span class="num">' + kgText(S.maxIn[l].kg) + "</span>kg" : "") + "</div></div>";
    const mi = maxInfo(l, cw);
    if (!mi) return '<div><div class="l">' + name + '</div><div class="d muted">MAXを入れてください</div></div>';
    const diff = mi.kg - mi.a.kg;
    return '<div><div class="l">' + name + 'のMAX</div><div class="v num">' + kgText(mi.kg) + 'kg</div><div class="d num">' +
      (diff ? (diff > 0 ? "+" : "") + kgText(diff) + "kg（" + mi.a.w + "週目から）" : mi.a.w + "週目から") + "</div></div>";
  }).join("") + "</div>";
  const tot = BIG3.map(l => knownMax(l, cw));
  if (tot.every(v => v != null)) h += '<p class="total">BIG3合計（MAX）<b class="num">' + kgText(tot.reduce((a, b) => a + b, 0)) + "</b>kg</p>";

  h += '<section class="sec" id="maxsec"><h2>MAX</h2><p class="lead">MAXを入れると、毎日の重さが自動で決まります。基準＝MAXの95%、その日の重さ＝基準の85・70・60%。MAXは測らなくて大丈夫です。直すと、今日から新しいMAXで計算します。</p><div class="maxgrid">' +
    BIG3.map(l => {
      const v = knownMax(l, cw), src = isPre(l) ? (S.maxIn[l] && S.maxIn[l].src) : ((maxInfo(l, cw) || {}).a || {}).src;
      return '<div class="mrow"><span class="ml">' + esc(P.lifts[l].name) + "</span>" + maxInput(l, v) +
        '<span class="mnote muted">' + [v != null && src === "est" ? "推定" : "", isPre(l) ? "卒業前" : ""].filter(Boolean).join("・") + "</span></div>";
    }).join("") + "</div>" +
    '<button class="btn" type="button" data-msaveall>MAXを保存</button><p class="status" data-mmsg role="status"></p>' + calcBox(null) + "</section>";

  h += '<section class="sec"><h2>週ごとのMAXと結果</h2><p class="lead">↑ 次の週に上がる　→ そのまま　↓ 下がる</p><table><thead><tr><th>週</th>' +
    BIG3.map(l => "<th>" + esc(P.lifts[l].name) + "</th>").join("") + "</tr></thead><tbody>";
  for (let w = 1; w <= 16; w++) {
    h += '<tr><td class="num">' + w + "</td>" + BIG3.map(l => {
      const mi = isPre(l) ? null : maxInfo(l, w);
      if (!mi) return '<td class="muted">—</td>';
      const r = weekResult(l, w, mi.kg, mi.a);
      return '<td class="num">' + kgText(mi.kg) + '<span class="muted" style="font-size:12px"> ' + (r === "up" ? "↑" : r === "down" ? "↓" : r === "keep" ? "→" : "") + "</span></td>";
    }).join("") + "</tr>";
  }
  h += "</tbody></table></section>";
  h += '<section class="sec"><h2>開始日</h2><p class="lead">開始日を変えると、「今日」のメニューの位置が変わります。記録は消えません。</p>' +
    '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="date" id="startDate" value="' + esc(S.start || ymd(new Date())) + '" style="border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:44px">' +
    '<button class="btn" type="button" id="setStart">この日にする</button></div></section>';
  if (CONFIG.pdfUrl) h += '<section class="sec"><h2>PDF版</h2><p class="lead">印刷して使いたいときは、PDF版をどうぞ。</p><a class="btn" href="' + esc(CONFIG.pdfUrl) + '" target="_blank" rel="noopener">PDFを開く</a></section>';
  h += '<section class="sec"><h2>記録を消す</h2><p class="lead">このスマホに保存したトレーニングの記録をすべて消します。卒業とMAXは残ります。元に戻せません。</p>' +
    '<button class="btn danger" type="button" id="reset" data-armed="0">記録をすべて消す</button></section>';
  app.innerHTML = h + cta() + fine();
}

/* ---- 描画と操作 ---- */
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === V.tab ? "page" : "false"));
  const tp = posOf(todayIndex());
  document.getElementById("todayBtn").hidden = !(S.start && (V.tab !== "today" || V.w !== tp.w || V.d !== tp.d));
  if (V.tab === "today") renderToday();
  else if (V.tab === "weeks") renderWeeks();
  else if (V.tab === "rules") renderRules();
  else if (V.tab === "form") renderForm();
  else renderLog();
}
function setField(setEl, field, value) {
  const lg = dayLog(V.w, V.d, true);
  const key = setEl.dataset.key;
  const v = lg.sets[key] || (lg.sets[key] = {});
  if (field === "kg") v.kg = value === "" ? "" : value.replace(",", ".");
  else if (field === "reps") v.reps = value === "" ? "" : value;
  else if (field === "rpe") v.rpe = value === "" ? null : Number(value);
  save();
}
function toggleSet(setEl) {
  const lg = dayLog(V.w, V.d, true);
  const key = setEl.dataset.key;
  const v = lg.sets[key] || (lg.sets[key] = {});
  const kgIn = setEl.querySelector('[data-f="kg"]'), repsIn = setEl.querySelector('[data-f="reps"]'), rpeIn = setEl.querySelector('[data-f="rpe"]');
  v.done = !v.done;
  if (v.done) {
    if (kgIn && (v.kg == null || v.kg === "") && kgIn.value !== "") v.kg = kgIn.value.replace(",", ".");
    if (repsIn && (v.reps == null || v.reps === "")) v.reps = repsIn.value || (setEl.dataset.acc ? "" : "5");
    if (rpeIn && v.rpe == null && rpeIn.value !== "") v.rpe = Number(rpeIn.value);
    if (kgIn) kgIn.classList.remove("sug");
  }
  save();
  const mark = setEl.querySelector(".mark");
  mark.setAttribute("aria-pressed", String(!!v.done));
  if (v.done) {
    mark.classList.add("just");
    const c = mark.querySelector(".pencircle");
    c.style.strokeDashoffset = "140";
    requestAnimationFrame(() => requestAnimationFrame(() => { c.style.strokeDashoffset = ""; }));
  }
  refreshEx(setEl.closest(".ex"));
  updateDayParts();
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, ng) => {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy") ? ok() : ng(); } catch (e) { ng(e); }
    document.body.removeChild(ta);
  });
}
function reportText() {
  const { w, d } = V, day = P.days[d - 1];
  const lg = dayLog(w, d, false) || { sets: {}, check: {}, memo: "" };
  const dt = dateOf(w, d);
  const lines = ["【日報】" + (dt ? jpDate(dt) + " " : "") + w + "週目・" + d + "日目 " + day.name];
  const ck = lg.check || {};
  lines.push("睡眠 " + (ck.sleep !== undefined && ck.sleep !== "" ? ck.sleep + "時間" : "—") + "／疲れ " + (ck.fatigue || "—") + "／痛み " + (ck.pain === true ? "あり" : ck.pain === false ? "なし" : "—"));
  const plan = planDay(w, d);
  plan.forEach(it => {
    const parts = [];
    for (let i = 0; i < it.sets; i++) {
      const v = lg.sets[it.lift + ":" + i];
      if (!v || !v.done) continue;
      const kg = v.kg !== undefined && v.kg !== "" ? kgText(Number(v.kg)) + "kg" : (it.acc ? "自重" : "—kg");
      parts.push(kg + "×" + (v.reps || "") + (it.acc ? "" : "（" + (v.rpe != null ? r2(v.rpe) : "—") + "）"));
    }
    if (parts.length) lines.push("・" + P.lifts[it.lift].name + (it.acc || it.pre ? "" : " " + it.pct + "%") + " " + parts.join(" "));
  });
  const pre = plan.filter(it => it.pre).map(it => P.lifts[it.lift].name);
  if (pre.length) lines.push("卒業前：" + pre.join("・") + "（動画を送ります）");
  if (lg.memo) lines.push("ひとこと：" + lg.memo);
  return lines.join("\n");
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  V.tab = b.dataset.tab;
  render();
  window.scrollTo(0, 0);
});
document.getElementById("todayBtn").addEventListener("click", () => { V.tab = "today"; goToday(); render(); window.scrollTo(0, 0); });

app.addEventListener("click", e => {
  const t = e.target;
  const mark = t.closest(".mark");
  if (mark) { toggleSet(mark.closest(".set")); return; }
  const step = t.closest("[data-step]");
  if (step) {
    let i = (V.w - 1) * 7 + (V.d - 1) + Number(step.dataset.step);
    i = Math.max(0, Math.min(111, i));
    const p = posOf(i); V.w = p.w; V.d = p.d; render(); return;
  }
  const dayB = t.closest("[data-day]");
  if (dayB) { V.d = Number(dayB.dataset.day); render(); return; }
  const gw = t.closest("[data-goweek]");
  if (gw) { V.tab = "today"; V.w = Number(gw.dataset.goweek); V.d = 1; render(); window.scrollTo(0, 0); return; }
  const fat = t.closest("[data-fatigue]");
  if (fat) {
    const lg = dayLog(V.w, V.d, true), n = Number(fat.dataset.fatigue);
    lg.check.fatigue = Number(lg.check.fatigue) === n ? null : n;
    save();
    fat.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(Number(lg.check.fatigue) === Number(b.dataset.fatigue))));
    updateDayParts();
    return;
  }
  const pain = t.closest("[data-pain]");
  if (pain) {
    const lg = dayLog(V.w, V.d, true), val = pain.dataset.pain === "1";
    lg.check.pain = lg.check.pain === val ? null : val;
    save();
    pain.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(lg.check.pain === (b.dataset.pain === "1"))));
    updateDayParts();
    return;
  }
  const gb = t.closest("[data-grad]");
  if (gb) {
    if (gb.dataset.armed !== "1") { gb.dataset.armed = "1"; gb.textContent = "理学療法士から卒業の返信が来ましたか？もう一度押すと卒業"; return; }
    const l = gb.dataset.grad, np = nowPos();
    S.grad[l] = ymd(new Date());
    S.gpos[l] = { w: np.w, d: np.d };
    /* 入れたMAXがあればそれを、なければ、いちばん新しい5回の記録から推定MAXを出す */
    let kg = S.maxIn[l] ? S.maxIn[l].kg : null, src = S.maxIn[l] ? S.maxIn[l].src : "in";
    if (kg == null) {
      const r = lastFive(l, Infinity);
      if (r) { kg = maxFromSet(r.kg, r.rpe); src = "est"; if (kg) S.maxIn[l] = { kg, src }; }
    }
    S.mx[l] = kg ? [{ w: np.w, d: np.d, kg, src }] : [];
    save(); render(); return;
  }
  const ug = t.closest("[data-ungrad]");
  if (ug) {
    const l = ug.dataset.ungrad, m = maxFor(l, nowPos().w);
    if (m != null) S.maxIn[l] = { kg: m, src: "in" };
    delete S.grad[l]; delete S.mx[l]; delete S.gpos[l];
    save(); render(); return;
  }
  const mc = t.closest("[data-mcalc]");
  if (mc) {
    const box = mc.closest(".basebox, #maxsec"), msg = box.querySelector("[data-mmsg]");
    const l = mc.dataset.mcalc || box.querySelector("[data-clift]").value;
    const kg = numIn(box.querySelector("[data-ckg]").value), rpe = Number(box.querySelector("[data-crpe]").value);
    const m = kg ? maxFromSet(kg, rpe) : null;
    if (!m) { if (msg) msg.textContent = "5回できた重さを数字で入れてください。"; return; }
    const inp = box.querySelector('[data-mkg="' + l + '"]');
    inp.value = kgText(m); inp.dataset.src = "est";
    if (msg) msg.textContent = P.lifts[l].name + "の推定MAXは" + kgText(m) + "kgです。よければ「" + (mc.dataset.mcalc ? "MAXを入れる" : "MAXを保存") + "」を押してください。";
    return;
  }
  const ms = t.closest("[data-msave]");
  if (ms) {
    const l = ms.dataset.msave, box = ms.closest(".basebox"), inp = box.querySelector('[data-mkg="' + l + '"]');
    const kg = numIn(inp.value);
    if (!kg) { box.querySelector("[data-mmsg]").textContent = "MAXを数字で入れてください（例：60）。"; return; }
    setMax(l, round05(kg), inp.dataset.src || "in");
    save(); render(); return;
  }
  if (t.closest("[data-msaveall]")) {
    const box = document.getElementById("maxsec"), msg = box.querySelector("[data-mmsg]"), cw = nowPos().w;
    let changed = 0, bad = 0;
    BIG3.forEach(l => {
      const inp = box.querySelector('[data-mkg="' + l + '"]');
      if (!inp || inp.value.trim() === "") return;
      const kg = numIn(inp.value);
      if (!kg) { bad++; return; }
      if (knownMax(l, cw) === round05(kg)) return;
      setMax(l, round05(kg), inp.dataset.src || "in"); changed++;
    });
    if (bad) { msg.textContent = "数字でないMAXがあります。数字で入れてください。"; return; }
    save(); render();
    const m2 = document.querySelector("#maxsec [data-mmsg]");
    if (m2) m2.textContent = changed ? "保存しました。今日から、このMAXで重さを計算します。" : "変わったMAXはありません。";
    return;
  }
  const gt = t.closest("[data-goto]");
  if (gt) { V.tab = gt.dataset.goto; render(); const ms2 = document.getElementById("maxsec"); if (ms2) ms2.scrollIntoView(); else window.scrollTo(0, 0); return; }
  if (t.id === "setStart") {
    const v = document.getElementById("startDate").value;
    if (!v) return;
    const card = t.closest(".start");
    if (card) {
      let bad = false;
      card.querySelectorAll("[data-mkg]").forEach(inp => { if (inp.value.trim() !== "" && !numIn(inp.value)) bad = true; });
      if (bad) { card.querySelector("[data-mmsg]").textContent = "MAXは数字で入れてください（わからなければ空欄のままで大丈夫です）。"; return; }
    }
    S.start = v;
    if (card) card.querySelectorAll("[data-mkg]").forEach(inp => { const kg = numIn(inp.value); if (kg) setMax(inp.dataset.mkg, round05(kg), "in"); });
    save(); V.tab = "today"; goToday(); render(); window.scrollTo(0, 0);
    return;
  }
  if (t.id === "copyReport") {
    const msg = document.getElementById("copyMsg");
    copyText(reportText()).then(() => { msg.textContent = "コピーしました。LINEのトークに貼って送れます。"; },
      () => { msg.textContent = "コピーできませんでした。長押しで選んでコピーしてください。"; });
    return;
  }
  if (t.id === "reset") {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "もう一度押すと消えます"; return; }
    S = { start: S.start, logs: {}, grad: S.grad, mx: S.mx, maxIn: S.maxIn, gpos: S.gpos }; save(); render();
  }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "memo") { const lg = dayLog(V.w, V.d, true); lg.memo = t.value; save(); return; }
  if (t.id === "sleep") { const lg = dayLog(V.w, V.d, true); lg.check.sleep = t.value.replace(",", "."); save(); return; }
  const setEl = t.closest(".set");
  if (setEl && t.dataset.f) { t.classList.remove("sug"); setField(setEl, t.dataset.f, t.value); }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "sleep") { updateDayParts(); return; }
  const setEl = t.closest(".set");
  if (setEl && t.dataset.f) { setField(setEl, t.dataset.f, t.value); refreshEx(setEl.closest(".ex")); }
});

if (!P) { app.textContent = "プログラムを読み込めませんでした。"; } else { render(); }
</script>
